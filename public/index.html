<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Billboard</title>
<script>window.__ASSET_V__='__ASSET_V__';</script>
<link rel="stylesheet" href="/css/app.css?v=__ASSET_V__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📌</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">Billboard</div>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-right">
      <span class="clock" id="clock"></span>
      <button class="ghost" id="logout" title="退出登录">退出</button>
    </div>
  </header>

  <main id="main"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <span id="modal-title">编辑</span>
        <button class="x" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot">
        <button class="danger-text" id="modal-del">删除</button>
        <div class="spacer"></div>
        <button class="ghost" id="modal-cancel">取消</button>
        <button class="primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/js/app.js?v=__ASSET_V__"></script>
</body>
</html>
