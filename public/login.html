<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Billboard · 登录</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1c2024; --muted:#6b7280;
    --line:#e4e7ec; --accent:#2f6feb; --danger:#d64545;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:360px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:32px 28px;
    box-shadow:0 6px 24px rgba(20,24,31,.06);
  }
  .logo{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  h1{font-size:22px; margin:0 0 20px; font-weight:650}
  input{
    width:100%; padding:12px 14px; font-size:16px; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; background:#fff; outline:none;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,235,.12)}
  button{
    width:100%; margin-top:14px; padding:12px; font-size:15px; font-weight:600; color:#fff;
    background:var(--accent); border:0; border-radius:10px; cursor:pointer;
  }
  button:hover{background:#245ac4}
  button:disabled{opacity:.6; cursor:default}
  .err{color:var(--danger); font-size:13px; min-height:20px; margin-top:10px}
  .foot{margin-top:18px; font-size:12px; color:var(--muted); text-align:center}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <div class="logo">Personal Billboard</div>
    <h1>输入密码</h1>
    <input type="password" id="pw" name="password" placeholder="密码" autofocus required>
    <button type="submit" id="btn">进入</button>
    <div class="err" id="err"></div>
    <div class="foot">连续输错会被暂时挡在门外</div>
  </form>
<script>
  const f = document.getElementById('f');
  const pw = document.getElementById('pw');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '检查中…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok) {
        location.href = '/index.html';
        return;
      }
      err.textContent = data.error || '登录失败';
      pw.value = '';
      pw.focus();
    } catch {
      err.textContent = '网络异常，稍后再试';
    } finally {
      btn.disabled = false;
      btn.textContent = '进入';
    }
  });
</script>
</body>
</html>
